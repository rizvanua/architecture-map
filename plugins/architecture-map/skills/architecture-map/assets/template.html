<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#0d1220;--grid:#151c2e;--panel:#141b2b;--panel2:#1b2438;--text:#e6ebf5;--muted:#8e9bb5;
  --line:#2a3550;--accent:#ff7a1a;--sel:#ffd166;--flow:#fde047;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overflow:hidden}
header{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;white-space:nowrap}
header h1 span{color:var(--accent)}
.sp{flex:1}
input,select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}
button:hover{border-color:#4a5a80}
#search{width:210px}
#searchWrap{position:relative}
#results{position:absolute;top:34px;left:0;width:380px;max-height:420px;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;z-index:20;display:none;box-shadow:0 10px 30px #0009}
#results div{padding:6px 10px;cursor:pointer;border-bottom:1px solid #ffffff08}
#results div:hover,#results div.on{background:#ffffff12}
#results small{color:var(--muted);display:block}
#lens{flex:none;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#lens button{border:0;border-radius:0;background:transparent;padding:6px 11px}
#lens button.on{background:var(--accent);color:#1a0d00;font-weight:600}
#filters{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;max-width:48vw}
.chip{flex:none;display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:12px;border:1px solid var(--line);cursor:pointer;user-select:none;font-size:12px}
.chip i{width:14px;height:3px;border-radius:2px;display:inline-block}
.chip.off{opacity:.35}
#crumbs{height:34px;display:flex;align-items:center;gap:6px;padding:0 14px;border-bottom:1px solid var(--line);background:#10172a;color:var(--muted)}
#crumbs a{color:var(--text);cursor:pointer;text-decoration:none}
#crumbs a:hover{color:var(--accent)}
#crumbs .hint{margin-left:auto;font-size:12px}
main{position:absolute;top:86px;left:0;right:0;bottom:0;display:flex}
#stage{flex:1;position:relative}
svg#canvas{width:100%;height:100%;display:block;cursor:grab;background:
  radial-gradient(circle,var(--grid) 1px,transparent 1px) 0 0/22px 22px}
svg#canvas.drag{cursor:grabbing}
#zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;align-items:center}
#zoomctl button{width:34px;height:34px;padding:0;font-size:16px}
#zoomlvl{font-size:11px;color:var(--muted)}
#minimap{position:absolute;left:14px;bottom:14px;width:200px;height:130px;background:#0b1020e0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#minimap svg{width:100%;height:100%}
aside#panel{width:400px;min-width:400px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px 18px 40px}
aside h2{font-size:17px;margin:0 0 4px}
aside h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
aside p{margin:6px 0}
aside ul{margin:4px 0;padding-left:18px}
aside li{margin:2px 0}
aside code{background:#ffffff10;border-radius:4px;padding:1px 5px;font-size:12px;word-break:break-all}
aside a{color:#7cb7ff}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.conn{display:flex;gap:6px;align-items:baseline;padding:3px 0;cursor:pointer}
.conn:hover{color:var(--accent)}
.conn i{width:10px;height:3px;border-radius:2px;flex:none;transform:translateY(-3px)}
.inf{color:#c9a227;font-size:11px}
.btnrow{display:flex;gap:6px;margin:10px 0}
.primary{background:var(--accent);border-color:var(--accent);color:#1a0d00;font-weight:600}
.steps li{padding:4px 6px;border-radius:6px;cursor:pointer;list-style:none;margin-left:-18px}
.steps li.cur{background:#ff7a1a26;outline:1px solid #ff7a1a80}
.steps b{color:var(--accent);margin-right:6px}
.kindrow{display:flex;align-items:center;gap:8px;margin:3px 0}
.kindrow span.sw{width:16px;height:12px;border-radius:3px;display:inline-block;border:2px solid}
.grp{padding:6px 8px;border-left:3px solid;margin:6px 0;cursor:pointer;background:#ffffff05;border-radius:0 6px 6px 0}
.grp:hover{background:#ffffff0d}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;color:var(--muted)}
/* svg */
.node{cursor:pointer}
.node rect.box{rx:10;stroke-width:1.6}
.node text{pointer-events:none}
.node .t{font-weight:600;font-size:13px;fill:#f3f6fc}
.node .s{font-size:10.5px;fill:#9fb0cf}
.node .d{font-size:9px;fill:#7f8eaa}
.node.ghost rect.box{stroke-dasharray:5 4;opacity:.75}
.node.sel rect.box{stroke:var(--sel)!important;stroke-width:3}
.node:hover rect.box{filter:brightness(1.25)}
.edge path{fill:none;stroke-width:1.6}
.edge text{font-size:10px;fill:#c3cde0;pointer-events:none}
.edge rect{fill:#0d1220;opacity:.85}
.edge.inferred path{stroke-dasharray:2 4}
.edge.kafka path{stroke-dasharray:7 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.edge .hit{stroke:transparent;stroke-width:12;cursor:pointer}
.group rect{rx:16;fill-opacity:.06;stroke-opacity:.5;stroke-width:1.5}
.group text{font-weight:700;font-size:15px;letter-spacing:.04em;cursor:pointer}
.group text.gd{font-weight:400;font-size:11px;letter-spacing:0;fill:#8e9bb5}
#world .node.lensdim{opacity:.28}
#world .group.lensdim{opacity:.35}
.edge.gedge path{stroke-dasharray:1 0}
#world.dim .node:not(.hl){opacity:.18}
#world.dim .edge:not(.hl){opacity:.07}
#world.dim .edge.hl path{stroke-width:2.8}
.lod-low .edge text,.lod-low .edge rect.lb,.lod-low .node .s,.lod-low .node .d{display:none}

.flowedge path{stroke:var(--flow);stroke-width:2.4;fill:none;opacity:.35}
.flowedge.cur path{opacity:1;stroke-width:4;stroke-dasharray:10 6;animation:flow .8s linear infinite}
.flowedge.done path{opacity:.75}
.flowedge circle{fill:var(--flow)}
.flowedge text{font-size:11px;font-weight:700;fill:#1a0d00;text-anchor:middle}
#world.flowing .edge{opacity:.08}
#world.flowing .node{opacity:.35}
#world.flowing .node.inflow{opacity:1}
</style>
</head>
<body>
<header>
  <h1>🗺️ <span>__TITLE__</span></h1>
  <div id="lens"></div>
  <div id="searchWrap"><input id="search" placeholder="Search services, modules, paths…  ( / )" autocomplete="off"><div id="results"></div></div>
  <select id="flowSel"><option value="">▶ Walk through a flow…</option></select>
  <div class="sp"></div>
  <div id="filters"></div>
</header>
<nav id="crumbs"></nav>
<main>
  <div id="stage">
    <svg id="canvas"><defs id="defs"></defs><g id="world"></g></svg>
    <div id="minimap"><svg id="mini"></svg></div>
    <div id="zoomctl">
      <button id="zin" title="Zoom in (+)">＋</button>
      <button id="zout" title="Zoom out (−)">－</button>
      <button id="zfit" title="Fit (0)">⤢</button>
      <span id="zoomlvl">100%</span>
    </div>
  </div>
  <aside id="panel"></aside>
</main>
<script>
/*__MODEL__*/
</script>
<script>
(() => {
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TYPES=MODEL.edgeTypes, KINDS=MODEL.kinds;
const byId={}, groupById={}, childIndex={};
MODEL.groups.forEach(g=>groupById[g.id]=g);
MODEL.nodes.forEach(n=>{byId[n.id]=n;(n.children?.nodes||[]).forEach(c=>childIndex[n.id+'/'+c.id]={parent:n,node:c});});

const svg=$('#canvas'), world=$('#world'), defs=$('#defs');
const GX=270, GY=120, NW=210, NH=70;
const LENSES=MODEL.lenses; let lens='runtime';
let view='root', selected=null, filters=new Set(LENSES.runtime.types);
let flow=null, step=-1, tx={x:0,y:0,k:1}, layout=null;

/* ---------- markers ---------- */
for(const [k,t] of Object.entries({...TYPES,flow:{color:"#fde047"}})){
  const m=el('marker',{id:'arr-'+k,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,0 L10,5 L0,10 z',fill:t.color},m);
}

/* ---------- layout builders ---------- */
function rootLayout(){
  const nodes=MODEL.nodes.map(n=>({id:n.id,ref:n,label:n.label,sub:n.tech,kind:n.kind,group:n.group,
    x:n.x*GX,y:n.y*GY,w:NW,h:NH,deep:!!n.children}));
  const groups=MODEL.groups.map(g=>{
    const ms=nodes.filter(n=>n.group===g.id); if(!ms.length) return null;
    const x0=Math.min(...ms.map(n=>n.x))-26, y0=Math.min(...ms.map(n=>n.y))-58,
          x1=Math.max(...ms.map(n=>n.x+n.w))+26, y1=Math.max(...ms.map(n=>n.y+n.h))+24;
    return {id:g.id,ref:g,x:x0,y:y0,w:x1-x0,h:y1-y0};
  }).filter(Boolean);
  const edges=MODEL.edges.map((e,i)=>({...e,i}));
  return {nodes,groups,edges};
}
function drillLayout(p){
  const ch=p.children, nodes=ch.nodes.map(c=>({id:c.id,ref:c,parent:p,label:c.label,sub:c.sub||c.path,kind:c.kind||'module',
    x:c.x*GX,y:c.y*GY,w:NW,h:NH}));
  const refs=new Map(); // ghost id -> 'in'|'out'
  ch.edges.forEach(e=>{
    if(e.from[0]==='@'&&!refs.has(e.from)) refs.set(e.from,'in');
    if(e.to[0]==='@'&&!refs.has(e.to)) refs.set(e.to,'out');
  });
  const minX=Math.min(...nodes.map(n=>n.x)), maxX=Math.max(...nodes.map(n=>n.x));
  const minY=Math.min(...nodes.map(n=>n.y)), maxY=Math.max(...nodes.map(n=>n.y));
  const ins=[...refs].filter(r=>r[1]==='in'), outs=[...refs].filter(r=>r[1]==='out');
  const place=(list,x)=>{const tot=(list.length-1)*GY*0.95, cy=(minY+maxY)/2;
    list.forEach(([rid],i)=>{const r=byId[rid.slice(1)]; if(!r){console.warn('missing',rid);return;}
      nodes.push({id:rid,ref:r,ghost:true,label:r.label,sub:groupById[r.group]?.label,kind:r.kind,
        x,y:cy-tot/2+i*GY*0.95,w:NW,h:NH});});};
  place(ins,minX-GX*1.25); place(outs,maxX+GX*1.25);
  const ids=new Set(nodes.map(n=>n.id));
  const edges=ch.edges.filter(e=>ids.has(e.from)&&ids.has(e.to)).map((e,i)=>({...e,i}));
  const g={id:p.id,ref:{label:p.label+' — inside',color:groupById[p.group].color,desc:p.repo||''},
    x:minX-30,y:minY-62,w:maxX-minX+NW+60,h:maxY-minY+NH+90};
  return {nodes,groups:[g],edges};
}

/* ---------- drawing ---------- */
function clip(a,b,pad=3){
  const cx=a.x+a.w/2,cy=a.y+a.h/2,dx=b.x+b.w/2-cx,dy=b.y+b.h/2-cy;
  if(!dx&&!dy)return{x:cx,y:cy};
  const s=Math.min((a.w/2+pad)/Math.abs(dx||1e-9),(a.h/2+pad)/Math.abs(dy||1e-9));
  return{x:cx+dx*s,y:cy+dy*s};
}
function curve(a,b,off){
  const p=clip(a,b),q=clip(b,a);
  const mx=(p.x+q.x)/2,my=(p.y+q.y)/2,dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy)||1;
  const bend=off+Math.min(40,len*0.08);
  const cx=mx-dy/len*bend,cy=my+dx/len*bend;
  return {d:`M${p.x},${p.y} Q${cx},${cy} ${q.x},${q.y}`,lx:(p.x+2*cx+q.x)/4,ly:(p.y+2*cy+q.y)/4};
}
function wrap(t,max){const w=String(t).split(' '),out=[];let cur='';
  for(const x of w){if((cur+' '+x).trim().length>max){if(cur)out.push(cur);cur=x;}else cur=(cur+' '+x).trim();}
  if(cur)out.push(cur);return out;}

function render(){
  world.innerHTML='';
  layout = view==='root'?rootLayout():drillLayout(byId[view]);
  const L=layout, nmap={}; L.nodes.forEach(n=>nmap[n.id]=n); L.groups.forEach(g=>{if(!nmap[g.id])nmap[g.id]={...g,isGroup:true};});
  const gl=el('g',{},world), el_=el('g',{},world), nl=el('g',{},world), fl=el('g',{id:'flowlayer'},world);
  for(const g of L.groups){
    const c=g.ref.color, gg=el('g',{class:'group','data-gid':g.id},gl); g._g=gg;
    el('rect',{x:g.x,y:g.y,width:g.w,height:g.h,fill:c,stroke:c},gg);
    const t=el('text',{x:g.x+16,y:g.y+24,fill:c},gg); t.textContent=g.ref.label;
    t.addEventListener('click',ev=>{ev.stopPropagation(); if(view==='root'){selectGroup(g.ref);zoomTo(g);}});
    if(g.ref.short){const d=el('text',{x:g.x+16,y:g.y+40,class:'gd'},gg);d.textContent=g.ref.short;}
  }
  // edges, offset parallels
  const pairCount={},pairIdx={};
  L.edges.forEach(e=>{const k=[e.from,e.to].sort().join('|');pairCount[k]=(pairCount[k]||0)+1;});
  for(const e of L.edges){
    const a=nmap[e.from],b=nmap[e.to]; if(!a||!b){console.warn('edge missing',e);continue;}
    const k=[e.from,e.to].sort().join('|'), i=pairIdx[k]=(pairIdx[k]??-1)+1, n=pairCount[k];
    const sign=e.from<e.to?1:-1, off=(i-(n-1)/2)*34*sign;
    const t=TYPES[e.type]||TYPES.http, c=curve(a,b,off);
    const g=el('g',{class:`edge ${e.type}${e.inferred?' inferred':''}${(a.isGroup||b.isGroup)?' gedge':''}`,'data-from':e.from,'data-to':e.to,'data-type':e.type},el_);
    if(!filters.has(e.type)) g.style.display='none';
    el('path',{d:c.d,stroke:t.color,'marker-end':`url(#arr-${e.type})`},g);
    const hit=el('path',{d:c.d,class:'hit'},g);
    if(e.label){
      const lines=wrap(e.label,26), lh=12, h=lines.length*lh+4;
      const wmax=Math.max(...lines.map(s=>s.length))*5.6+10;
      el('rect',{class:'lb',x:c.lx-wmax/2,y:c.ly-h/2,width:wmax,height:h,rx:4},g);
      lines.forEach((s,j)=>{const tt=el('text',{x:c.lx,y:c.ly-h/2+lh*(j+1)-1,'text-anchor':'middle'},g);tt.textContent=s;});
    }
    hit.addEventListener('click',ev=>{ev.stopPropagation();if(!dragged)showEdge(e);});
    e._g=g;
  }
  for(const n of L.nodes){
    const K=KINDS[n.kind]||KINDS.service;
    const col=n.ghost?'#5b6785':(n.group?groupById[n.group].color:(n.parent?groupById[n.parent.group].color:'#888'));
    const g=el('g',{class:'node'+(n.ghost?' ghost':''),'data-id':n.id,transform:`translate(${n.x},${n.y})`},nl);
    el('rect',{class:'box',width:n.w,height:n.h,fill:K.fill,stroke:col},g);
    el('rect',{width:6,height:n.h-16,x:0,y:8,rx:3,fill:col},g);
    const t=el('text',{x:16,y:24,class:'t'},g); t.textContent=K.icon+' '+trunc(n.label,24);
    const s=el('text',{x:16,y:41,class:'s'},g); s.textContent=trunc(n.sub||'',34);
    const d=el('text',{x:16,y:58,class:'d'},g);
    d.textContent=lensLine(n,K);
    if(n.ref?.docs?.length){el('text',{x:n.w-(n.deep||n.ghost&&n.ref.children?38:20),y:22,'font-size':12},g).textContent='📘';}
    if(n.deep||n.ghost&&n.ref.children){el('text',{x:n.w-20,y:22,fill:col,'font-size':14},g).textContent='⊕';}
    g.addEventListener('click',ev=>{ev.stopPropagation();if(dragged)return;select(n);});
    g.addEventListener('dblclick',ev=>{ev.stopPropagation();
      if(n.ghost){go(n.ref.children?n.ref.id:'root',n.ref.children?null:n.ref.id);} else if(n.deep) go(n.id); });
    g.addEventListener('mouseenter',()=>hover(n.id,true));
    g.addEventListener('mouseleave',()=>hover(n.id,false));
    n._g=g;
  }
  if(selected){const n=nmap[selected];if(n)n._g.classList.add('sel');}
  drawFlow(); crumbs(); minimap(); updateLOD(); applyLens();
}
function lensLine(n,K){
  const r=n.ref||{};
  if(lens==='delivery'&&r.cicd?.line) return '🚀 '+trunc(r.cicd.line,40);
  if(lens==='observe'&&r.obs?.line) return '📈 '+trunc(r.obs.line,40);
  return n.ghost?'↩ external — double-click to open':(n.deep?`▸ ${n.ref.children.nodes.length} modules — double-click to open`:K.label);
}
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;

function applyLens(){
  if(!layout)return;
  const vis=layout.edges.filter(e=>filters.has(e.type)), hot=new Set();
  const memb=id=>{const g=layout.groups.find(x=>x.id===id); return g&&view==='root'?layout.nodes.filter(n=>n.group===id).map(n=>n.id):[id];};
  vis.forEach(e=>{memb(e.from).forEach(x=>hot.add(x));memb(e.to).forEach(x=>hot.add(x));});
  layout.nodes.forEach(n=>{ if(!n._g)return; const ls=n.ref?.lenses; let dim=false;
    if(lens==='runtime') dim=!!(ls&&!ls.includes('runtime'));
    else if(lens!=='all') dim=!hot.has(n.id)&&!(ls||[]).includes(lens);
    n._g.classList.toggle('lensdim',dim);});
  layout.groups.forEach(g=>{ if(!g._g)return; const ls=g.ref?.lenses; g._g.classList.toggle('lensdim',lens==='runtime'&&!!ls||(lens!=='runtime'&&lens!=='all'&&!!ls&&!ls.includes(lens)));});
}
function syncChips(){document.querySelectorAll('#filters .chip').forEach(c=>{c.classList.toggle('off',!filters.has(c.dataset.k));c.style.display=lens==='all'||LENSES[lens].types.includes(c.dataset.k)?'':'none';});}
function setLens(k){
  lens=k; filters=new Set(LENSES[k].types);
  document.querySelectorAll('#lens button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  syncChips();
  render(); if(!flow&&!selected) (view==='root'?showOverview():select({ref:byId[view],id:view,kind:byId[view].kind}));
  const h=new URLSearchParams(location.hash.slice(1)); k==='runtime'?h.delete('lens'):h.set('lens',k); location.hash=h.toString();
}
for(const [k,l] of Object.entries(LENSES)){const b=document.createElement('button');b.textContent=l.label;b.dataset.k=k;b.title=l.desc||'';b.onclick=()=>setLens(k);$('#lens').appendChild(b);}
function hover(id,on){
  if(flow)return;
  world.classList.toggle('dim',on);
  world.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
  if(!on)return;
  layout.nodes.find(n=>n.id===id)?._g.classList.add('hl');
  const gid=layout.nodes.find(n=>n.id===id)?.group;
  for(const e of layout.edges){ if(e.from===id||e.to===id||(gid&&(e.from===gid||e.to===gid))){
    e._g?.classList.add('hl');
    layout.nodes.find(n=>n.id===(e.from===id?e.to:e.from))?._g.classList.add('hl');}}
}

/* ---------- flows ---------- */
MODEL.flows.forEach(f=>{const o=document.createElement('option');o.value=f.id;o.textContent='▶ '+f.label;$('#flowSel').appendChild(o);});
$('#flowSel').onchange=e=>{const f=MODEL.flows.find(x=>x.id===e.target.value); startFlow(f);};
function startFlow(f){
  flow=f||null; step=f?0:-1; selected=null; if(f&&f.lens&&f.lens!==lens){lens=f.lens;filters=new Set(LENSES[lens].types);document.querySelectorAll('#lens button').forEach(b=>b.classList.toggle('on',b.dataset.k===lens));syncChips();}
  if(f){ view=f.view||'root'; render(); fit(); } else render();
  showFlowPanel(); $('#flowSel').value=f?f.id:'';
}
function drawFlow(){
  world.classList.toggle('flowing',!!flow);
  const fl=$('#flowlayer'); if(!fl)return; fl.innerHTML='';
  if(!flow) return;
  const nmap={}; layout.groups.forEach(g=>nmap[g.id]=g); layout.nodes.forEach(n=>nmap[n.id]=n);
  const pairs={};
  flow.steps.forEach((s,i)=>{
    const a=nmap[s.from],b=nmap[s.to]; if(!a||!b){console.warn('flow step missing',s);return;}
    a._g.classList.add('inflow'); b._g.classList.add('inflow');
    if(s.from===s.to) return;
    const k=[s.from,s.to].sort().join('|'); const n=pairs[k]=(pairs[k]||0)+1;
    const off=(n-1)*26*(s.from<s.to?1:-1)-10;

/* ---------- pan / zoom ---------- */
function apply(){world.setAttribute('transform',`translate(${tx.x},${tx.y}) scale(${tx.k})`);$('#zoomlvl').textContent=Math.round(tx.k*100)+'%';updateLOD();miniView();}

    tx={x:t1.x+(t2.x-t1.x)*e,y:t1.y+(t2.y-t1.y)*e,k:t1.k+(t2.k-t1.k)*e};apply();if(p<1)anim=requestAnimationFrame(stepA);};
  anim=requestAnimationFrame(stepA);}
function zoomTo(b,maxK=1.6,instant){const r=svg.getBoundingClientRect(),pad=50;

  text:[c.label,c.desc,c.path,(c.files||[]).join(' ')].join(' '),go:()=>go(n.id,c.id)})));
const S=$('#search'),R=$('#results');let hits=[],hi=0;

  const terms=q.split(/\s+/);

    return {...x,score:(l.startsWith(q)?3:l.includes(q)?2:0)};}).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,30);
  hi=0;drawHits();};
function drawHits(){R.innerHTML=hits.length?hits.map((h,i)=>`<div class="${i===hi?'on':''}" data-i="${i}">${esc(h.label)}<small>${esc(h.where)}</small></div>`).join(''):'<div><small>No matches</small></div>';
  R.style.display='block';R.querySelectorAll('[data-i]').forEach(d=>d.onmousedown=()=>pick(+d.dataset.i));}
function pick(i){const h=hits[i];if(!h)return;R.style.display='none';S.value='';S.blur();h.go();}
S.onkeydown=e=>{if(e.key==='ArrowDown'){hi=Math.min(hits.length-1,hi+1);drawHits();e.preventDefault();}
  else if(e.key==='ArrowUp'){hi=Math.max(0,hi-1);drawHits();e.preventDefault();}
  else if(e.key==='Enter')pick(hi); else if(e.key==='Escape'){R.style.display='none';S.blur();}};
S.onblur=()=>setTimeout(()=>R.style.display='none',150);

/* ---------- keys ---------- */
window.addEventListener('keydown',e=>{
  if(document.activeElement===S||e.target.tagName==='SELECT')return;
  const r=svg.getBoundingClientRect();
  if(e.key==='/'){e.preventDefault();S.focus();}
  else if(e.key==='+'||e.key==='=')zoomAt(r.width/2,r.height/2,1.25);
  else if(e.key==='-')zoomAt(r.width/2,r.height/2,0.8);
  else if(e.key==='0')fit();
  else if(e.key==='ArrowRight'&&flow)stepFlow(1);
  else if(e.key==='ArrowLeft'&&flow)stepFlow(-1);
  else if(e.key==='Escape'){if(flow)startFlow(null);else if(view!=='root')go('root',view);}
});

/* ---------- boot ---------- */
const hp=new URLSearchParams(location.hash.slice(1));
const l0=hp.get('lens'); if(l0&&LENSES[l0]){lens=l0;filters=new Set(LENSES[l0].types);}
const v0=hp.get('view'); view=v0&&byId[v0]?.children?v0:'root';
document.querySelectorAll('#lens button').forEach(b=>b.classList.toggle('on',b.dataset.k===lens));
syncChips();
render(); requestAnimationFrame(()=>{fit(true);
  const f0=MODEL.flows.find(f=>f.id===hp.get('flow')); if(f0){startFlow(f0);return;}
  const s=hp.get('sel'); if(s){const n=layout.nodes.find(x=>x.id===s);if(n){select(n);center(n,1.1);return;}}
  view==='root'?showOverview():select({ref:byId[view],id:view,kind:byId[view].kind});});
})();
</script>
</body>
</html>
